name: test

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Tests (ASan + UBSan, with and without the Arduino stand-in)
        run: make -C test CXX=${{ matrix.cxx }}

      - name: Examples (PC build with Arduino stand-in)
        run: make -C test examples CXX=${{ matrix.cxx }}

      - name: Same struct with ReflectJSON and ReflectINI
        run: |
          git clone --depth 1 https://github.com/Michael-0-sys/ReflectJSON.git /tmp/ReflectJSON
          git clone --depth 1 https://github.com/Michael-0-sys/ReflectINI.git /tmp/ReflectINI
          make -C test json_ini \
            REFLECTJSON=/tmp/ReflectJSON/src \
            REFLECTINI=/tmp/ReflectINI/src \
            CXX=${{ matrix.cxx }}

  arduino-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update
          compliance: specification

  compile-examples:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        board:
          # RP2040 / RP2350 using the Earle Philhower Arduino-Pico core.
          # Includes the generic examples and the PicoLock examples.
          - name: RP2040
            fqbn: rp2040:rp2040:rpipico
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            sketches: |
              - examples/01_NoLock_Basic
              - examples/02_NoLock_ReflectStruct
              - examples/03_PicoLock_DualCore
              - examples/04_PicoLock_AtomicMultiKey
              - examples/07_INI_JSON_State_SameStruct

          # ESP32-S3 dual-core target.
          # Includes the generic examples and the Esp32Lock example.
          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
            sketches: |
              - examples/01_NoLock_Basic
              - examples/02_NoLock_ReflectStruct
              - examples/05_ESP32Lock_TwoCores
              - examples/07_INI_JSON_State_SameStruct

          # UNO R4 is useful as an additional C++17/compiler compatibility test.
          # Platform-specific Pico/ESP32/Teensy examples are intentionally skipped.
          - name: UNO R4 Minima
            fqbn: arduino:renesas_uno:minima
            platforms: |
              - name: arduino:renesas_uno
            sketches: |
              - examples/01_NoLock_Basic
              - examples/02_NoLock_ReflectStruct
              - examples/07_INI_JSON_State_SameStruct

    steps:
      - uses: actions/checkout@v4

      - name: Compile examples - ${{ matrix.board.name }}
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}

          # ReflectJSON and ReflectINI are only required by example 07,
          # but installing them for the complete job keeps the setup simple.
          libraries: |
            - source-path: ./
            - source-url: https://github.com/Michael-0-sys/ReflectJSON.git
            - source-url: https://github.com/Michael-0-sys/ReflectINI.git

          sketch-paths: ${{ matrix.board.sketches }}
